<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Sign in to Enterprise Dashboard"><title>Sign in - Enterprise Dashboard</title>
<link rel="stylesheet" href="../css/dashboard.css"><link rel="stylesheet" href="../css/capstone.css"></head><body>
<main class="login-wrap" id="main-content"><section class="card" aria-labelledby="login-heading">
<h1 id="login-heading">Sign in</h1>
<form id="login-form" novalidate>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8"></div>
<p id="login-status" class="status" role="status" aria-live="polite"></p>
<button type="submit">Sign in</button></form>
</section></main><script src="../js/auth.js"></script></body></html>
